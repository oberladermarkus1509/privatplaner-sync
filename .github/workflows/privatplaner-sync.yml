name: Privatplaner Bookeo Sync

on:
  schedule:
    # Alle 10 Minuten. GitHub garantiert dieses Timing nicht exakt (kann sich je nach
    # Auslastung um ein paar Minuten verschieben) - fuer diesen Zweck unproblematisch.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    # Feste Ubuntu-Version statt ubuntu-latest: ab 19.10.2026 wechselt "latest" auf Ubuntu 26,
    # dort koennte die Browser-Installation von Playwright scheitern.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: node sync.js
        env:
          PRIVATPLANER_EDIT_PASSWORD: ${{ secrets.PRIVATPLANER_EDIT_PASSWORD }}
